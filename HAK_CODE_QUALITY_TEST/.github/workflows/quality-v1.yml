name: HAK Quality V1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run evidence-based quality gate
        run: python HAK_CODE_QUALITY_TEST/quality_gate.py --config HAK_CODE_QUALITY_TEST/config/luong-hak.json --out hak-quality-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hak-quality-results
          path: hak-quality-results.json
