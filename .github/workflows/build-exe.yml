name: CI & Build Windows installer
on:
  workflow_dispatch:
  pull_request:
    paths: ["LuongHAK_Offline/**", ".github/workflows/build-exe.yml"]
  push:
    branches: [claude/dazzling-cray-idw87u]
    paths: ["LuongHAK_Offline/**", ".github/workflows/build-exe.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: LuongHAK_Offline
jobs:
  check:
    name: Cú pháp · Lint · Unit/Integration/Regression · Phụ thuộc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Kiểm tra cú pháp
        run: for f in app.js engine.js hr.js main.js preload.js core/*.js main/*.js ui/*.js; do node --check "$f"; done
      - name: Lint (eslint, không chấp nhận cảnh báo)
        run: npx --yes eslint@9.39.5 . --max-warnings 0
      - name: Unit + Integration + Regression (so với v1.3.0)
        run: npm test
      - name: Kiểm tra phụ thuộc — phần chạy trong app (bắt buộc sạch)
        run: npm audit --omit=dev --audit-level=low
      - name: Kiểm tra phụ thuộc — công cụ build (chỉ báo cáo, xem docs/AUDIT_REPORT.md)
        run: npm audit --audit-level=high || echo "::warning::Có lỗ hổng trong công cụ build — xem báo cáo"
        continue-on-error: true
  e2e:
    name: E2E trên Electron thật
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - name: Chạy E2E (xvfb)
        run: xvfb-run -a npm run test:e2e
        env: { PLAYWRIGHT_MODULE: playwright }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-result, path: LuongHAK_Offline/tests/e2e/last-e2e-result.json }
  build:
    name: Build bộ cài Windows
    runs-on: windows-latest
    needs: [check, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TinhLuongHAK-Setup
          path: LuongHAK_Offline/dist/*.exe
