name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [claude/dazzling-cray-idw87u]
    paths: ["LuongHAK_Offline/**", ".github/workflows/build-exe.yml"]
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: LuongHAK_Offline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TinhLuongHAK-Setup
          path: LuongHAK_Offline/dist/*.exe
