          $manifest = Get-Content (Join-Path $home 'manifest.json') -Raw | ConvertFrom-Json
          $result = Join-Path $home $manifest.fileName
          if (-not (Test-Path $result)) { throw 'End-user CMD did not write reconstructed EXE' }
          $hash = (Get-FileHash $result -Algorithm SHA256).Hash.ToLowerInvariant()
