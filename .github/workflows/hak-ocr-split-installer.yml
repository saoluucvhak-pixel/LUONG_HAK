name: HAK Smart OCR AI - Split Windows Setup EXE

on:
  push:
    branches: ["feature/hak-smart-ocr-ai-windows"]
    paths:
      - "distribution/hak-ocr-split/**"
      - ".github/workflows/hak-ocr-split-installer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  split-windows-setup:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout split and join scripts
        uses: actions/checkout@v4
      - name: Download already verified Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: HAKSmartOCRAI-Windows-x64-1.2.0-alpha
          run-id: 38835954804
          github-token: ${{ github.token }}
          path: original-release
      - name: Split Windows installer into independently checked parts
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'original-release' -Recurse -File -Filter 'HAKSmartOCRAI-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Verified EXE installer missing from downloaded artifact.' }
          & ./distribution/hak-ocr-split/SPLIT_SETUP.ps1 -SourceExe $setup.FullName -OutputDir 'split-output' -ChunkMiB 40
          $manifest = Get-Content 'split-output/manifest.json' -Raw | ConvertFrom-Json
          Write-Host "Parts count: $($manifest.partCount), checksum: $($manifest.sha256)"
          if ($manifest.partCount -lt 2 -or $manifest.partCount -gt 16) { throw 'Unexpected part count' }
          $checkDir = 'split-roundtrip'
          New-Item -ItemType Directory -Path $checkDir -Force | Out-Null
          & ./distribution/hak-ocr-split/GHEP_SETUP.ps1 -InputDirectory 'split-output/parts' -ManifestPath 'split-output/manifest.json' -OutputDirectory $checkDir
          $joined = Join-Path $checkDir $manifest.fileName
          if (-not (Test-Path $joined)) { throw 'Reconstructed installer not found' }
          $sum = (Get-FileHash $joined -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sum -ne $manifest.sha256) { throw 'Roundtrip SHA256 verification failed' }
          Write-Host 'SPLIT_AND_JOIN_ROUNDTRIP_PASS'
      - name: Test user double-click join BAT from Windows folder with spaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $home = Join-Path $env:RUNNER_TEMP 'HAK OCR DOWNLOAD TEST'
          New-Item -ItemType Directory -Path $home -Force | Out-Null
          foreach ($file in @('GHEP_SETUP.ps1','GHEP_FILE_EXE.cmd')) {
            Copy-Item (Join-Path 'distribution/hak-ocr-split' $file) (Join-Path $home $file)
          }
          Copy-Item 'split-output/manifest.json' (Join-Path $home 'manifest.json')
          foreach ($part in @(Get-ChildItem 'split-output/parts' -File)) {
            $match = [regex]::Match($part.Name, 'part(\d{3})        shell: pwsh
        run: |
