name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [feature/luong-hak-offline-v9-2-business-completion]
    paths: ["LuongHAK_Offline/**", ".github/workflows/build-windows.yml"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LuongHAK_Offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: TinhLuongHAK-Windows-x64
          path: |
            LuongHAK_Offline/dist/*.exe
          retention-days: 14
